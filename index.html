<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Impact - تسجيل الدخول</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* خلفية متحركة */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .bg-animation .circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(236, 72, 153, 0.1));
            animation: float 20s infinite ease-in-out;
        }

        .circle:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .circle:nth-child(2) {
            width: 500px;
            height: 500px;
            bottom: -200px;
            left: -200px;
            animation-delay: 5s;
            animation-duration: 25s;
        }

        .circle:nth-child(3) {
            width: 200px;
            height: 200px;
            top: 50%;
            right: 20%;
            animation-delay: 10s;
            animation-duration: 15s;
        }

        .circle:nth-child(4) {
            width: 400px;
            height: 400px;
            bottom: 10%;
            right: -150px;
            animation-delay: 3s;
            animation-duration: 30s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-50px) rotate(10deg);
            }
        }

        /* حاوية تسجيل الدخول */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 450px;
            margin: 20px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 40px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .login-card:hover {
            border-color: rgba(99, 102, 241, 0.6);
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.2);
        }

        /* الشعار */
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 36px;
            color: white;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
            animation: pulse-glow 3s infinite;
        }

        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
            }
            50% {
                box-shadow: 0 0 50px rgba(99, 102, 241, 0.6);
            }
        }

        .logo-text {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #818cf8, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .logo-sub {
            font-size: 12px;
            color: #64748b;
            margin-top: 5px;
        }

        /* عنوان النموذج */
        .form-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-title h2 {
            color: #f8fafc;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-title p {
            color: #94a3b8;
            font-size: 14px;
        }

        /* الحقول */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            right: 15px;
            color: #64748b;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 45px 14px 15px;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 14px;
            color: #f8fafc;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
            direction: rtl;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .input-wrapper input:focus + i {
            color: #6366f1;
        }

        /* خيارات إضافية */
        .options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            cursor: pointer;
        }

        .checkbox input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #6366f1;
        }

        .forgot-link {
            color: #818cf8;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .forgot-link:hover {
            color: #6366f1;
        }

        /* زر تسجيل الدخول */
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            border: none;
            border-radius: 14px;
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* حسابات تجريبية */
        .demo-accounts {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #334155;
        }

        .demo-title {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .demo-buttons {
            display: flex;
            gap: 15px;
        }

        .demo-btn {
            flex: 1;
            padding: 10px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #94a3b8;
            font-family: 'Cairo', sans-serif;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .demo-btn.admin {
            border-color: #6366f1;
            color: #818cf8;
        }

        .demo-btn.viewer {
            border-color: #10b981;
            color: #34d399;
        }

        .demo-btn:hover {
            transform: translateY(-2px);
        }

        .demo-btn.admin:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        .demo-btn.viewer:hover {
            background: rgba(16, 185, 129, 0.1);
        }

        /* رسالة الخطأ */
        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ef4444;
            font-size: 13px;
            display: none;
        }

        .error-message.show {
            display: flex;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* وضع الصيانة */
        .maintenance-badge {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background: rgba(245, 158, 11, 0.1);
            border-radius: 12px;
            color: #f59e0b;
            font-size: 12px;
            display: none;
        }

        /* تذييل */
        .footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: #64748b;
            font-size: 12px;
            z-index: 1;
        }

        /* توست */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transform: translateX(-100%);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            min-width: 280px;
        }

        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        .toast.success .toast-icon {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }

        .toast.error .toast-icon {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .toast-icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .toast-content {
            flex: 1;
        }

        .toast-title {
            font-weight: 700;
            font-size: 13px;
        }

        .toast-message {
            font-size: 12px;
            color: #94a3b8;
        }

        /* توافق الجوال */
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }
            
            .logo-icon {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }
            
            .logo-text {
                font-size: 24px;
            }
            
            .demo-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- خلفية متحركة -->
    <div class="bg-animation">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- توست -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- حاوية تسجيل الدخول -->
    <div class="login-container">
        <div class="login-card">
            <!-- الشعار -->
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-play"></i>
                </div>
                <div class="logo-text">Watch Impact</div>
                <div class="logo-sub">منصة البث المباشر</div>
            </div>

            <!-- عنوان -->
            <div class="form-title">
                <h2>مرحباً بك</h2>
                <p>سجل الدخول للمتابعة أو الإدارة</p>
            </div>

            <!-- رسالة الخطأ -->
            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-triangle"></i>
                <span id="errorText">خطأ في البريد الإلكتروني أو كلمة المرور</span>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="example@email.com" required autocomplete="email">
                    </div>
                </div>

                <div class="input-group">
                    <label>كلمة المرور</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>

                <div class="options">
                    <label class="checkbox">
                        <input type="checkbox" id="rememberMe">
                        <span>تذكرني</span>
                    </label>
                    <a href="#" class="forgot-link" onclick="showToast('info', 'نسيت كلمة المرور', 'يرجى التواصل مع الدعم الفني')">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    تسجيل الدخول
                </button>
            </form>

            <!-- حسابات تجريبية -->
            <div class="demo-accounts">
                <div class="demo-title">
                    <i class="fas fa-flask"></i> حسابات تجريبية
                </div>
                <div class="demo-buttons">
                    <button class="demo-btn admin" onclick="fillDemoAdmin()">
                        <i class="fas fa-crown"></i>
                        مسؤول
                    </button>
                    <button class="demo-btn viewer" onclick="fillDemoViewer()">
                        <i class="fas fa-user"></i>
                        مشاهد
                    </button>
                </div>
            </div>

            <!-- وضع الصيانة -->
            <div class="maintenance-badge" id="maintenanceBadge">
                <i class="fas fa-tools"></i>
                الموقع في وضع الصيانة حالياً
            </div>
        </div>
    </div>

    <!-- تذييل -->
    <div class="footer">
        <p>جميع الحقوق محفوظة © 2026 Watch Impact</p>
    </div>

    <script>
        // ==================== المفاتيح والتخزين ====================
        const STORAGE_KEYS = {
            USERS: 'watchImpact_users',
            SESSION: 'watchImpact_session',
            CONFIG: 'watchImpact_config'
        };

        // ==================== بيانات المستخدمين الافتراضية ====================
        const DEFAULT_USERS = [
            {
                id: 1,
                name: 'المدير العام',
                email: 'admin@watchimpact.com',
                password: 'admin123',
                role: 'admin',
                status: 'active',
                avatar: 'A',
                lastLogin: null
            },
            {
                id: 2,
                name: 'مشاهد',
                email: 'viewer@watchimpact.com',
                password: 'viewer123',
                role: 'viewer',
                status: 'active',
                avatar: 'M',
                lastLogin: null
            }
        ];

        // ==================== إدارة البيانات ====================
        function getUsers() {
            const stored = localStorage.getItem(STORAGE_KEYS.USERS);
            if (stored) {
                try {
                    const users = JSON.parse(stored);
                    if (users && users.length > 0) return users;
                } catch(e) {}
            }
            localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(DEFAULT_USERS));
            return [...DEFAULT_USERS];
        }

        function saveUsers(users) {
            localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
        }

        function getSession() {
            const stored = localStorage.getItem(STORAGE_KEYS.SESSION);
            if (stored) {
                try {
                    const session = JSON.parse(stored);
                    if (session.expiry && session.expiry > Date.now()) {
                        return session;
                    }
                } catch(e) {}
            }
            return null;
        }

        function saveSession(user) {
            const session = {
                user: {
                    id: user.id,
                    name: user.name,
                    email: user.email,
                    role: user.role,
                    avatar: user.avatar
                },
                expiry: Date.now() + (60 * 60 * 1000)
            };
            localStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify(session));
        }

        function clearSession() {
            localStorage.removeItem(STORAGE_KEYS.SESSION);
        }

        function getSiteConfig() {
            const stored = localStorage.getItem(STORAGE_KEYS.CONFIG);
            if (stored) {
                try {
                    return JSON.parse(stored);
                } catch(e) {}
            }
            return {
                siteName: 'Watch Impact',
                siteDesc: 'منصة البث المباشر',
                maintenanceMode: false,
                primaryColor: '#6366f1'
            };
        }

        // ==================== تسجيل الدخول ====================
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            const config = getSiteConfig();
            if (config.maintenanceMode && email !== 'admin@watchimpact.com') {
                showError('الموقع في وضع الصيانة حالياً، فقط المدير يمكنه الدخول');
                return;
            }
            
            const users = getUsers();
            const user = users.find(u => u.email === email && u.password === password && u.status === 'active');
            
            if (!user) {
                showError('البريد الإلكتروني أو كلمة المرور غير صحيحة');
                return;
            }
            
            user.lastLogin = new Date().toLocaleString('ar-SA');
            saveUsers(users);
            
            if (rememberMe) {
                saveSession(user);
            } else {
                sessionStorage.setItem('temp_session', JSON.stringify({
                    user: {
                        id: user.id,
                        name: user.name,
                        email: user.email,
                        role: user.role,
                        avatar: user.avatar
                    }
                }));
            }
            
            showToast('success', 'مرحباً بك', 'تم تسجيل الدخول بنجاح، جاري التحويل...');
            
            setTimeout(() => {
                if (user.role === 'admin') {
                    window.location.href = 'watch-impact-dashboard.html';
                } else {
                    window.location.href = 'watch-impact.html';
                }
            }, 1000);
        }
        
        function fillDemoAdmin() {
            document.getElementById('email').value = 'admin@watchimpact.com';
            document.getElementById('password').value = 'admin123';
            document.getElementById('rememberMe').checked = true;
            showToast('info', 'حساب مسؤول', 'تم ملء بيانات حساب المدير');
        }
        
        function fillDemoViewer() {
            document.getElementById('email').value = 'viewer@watchimpact.com';
            document.getElementById('password').value = 'viewer123';
            document.getElementById('rememberMe').checked = true;
            showToast('info', 'حساب مشاهد', 'تم ملء بيانات حساب المشاهد');
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => errorDiv.classList.remove('show'), 3000);
        }
        
        function showToast(type, title, message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            const icons = { success: 'fa-check-circle', error: 'fa-times-circle', info: 'fa-info-circle', warning: 'fa-exclamation-triangle' };
            toast.innerHTML = `
                <div class="toast-icon"><i class="fas ${icons[type] || 'fa-info-circle'}"></i></div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }
        
        function checkExistingSession() {
            let session = getSession();
            if (!session) {
                const tempSession = sessionStorage.getItem('temp_session');
                if (tempSession) {
                    try { session = JSON.parse(tempSession); } catch(e) {}
                }
            }
            if (session && session.user) {
                setTimeout(() => {
                    if (session.user.role === 'admin') {
                        window.location.href = 'watch-impact-dashboard.html';
                    } else {
                        window.location.href = 'watch-impact.html';
                    }
                }, 500);
            }
        }
        
        function checkMaintenanceMode() {
            const config = getSiteConfig();
            if (config.maintenanceMode) {
                document.getElementById('maintenanceBadge').style.display = 'block';
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            getUsers();
            checkExistingSession();
            checkMaintenanceMode();
            document.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('loginForm').dispatchEvent(new Event('submit'));
                }
            });
        });
    </script>
</body>
</html>
